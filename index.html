<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="California State Roleplay — join our community on Discord.">
  <title>California State Roleplay</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1220;
      --surface: #111c2d;
      --surface-soft: #152238;
      --line: #263750;
      --blue: #4d83e6;
      --blue-soft: #1c3458;
      --text: #f4f7fc;
      --muted: #aab8cc;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% -20%, #1b3151 0, var(--bg) 55%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .page { width: min(1040px, calc(100% - 36px)); margin: 30px auto 54px; }
    .notice { margin-bottom: 18px; padding: 16px 20px; border: 2px solid #ff3333; border-radius: 12px; background: #4a0808; color: #fff; text-align: center; font-size: clamp(1.8rem, 6vw, 3.2rem); font-weight: 950; letter-spacing: .08em; text-shadow: 0 2px 12px #ff000088; }
    .banner {
      display: block;
      width: 100%;
      max-height: 340px;
      object-fit: cover;
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 18px 50px #0005;
    }
    main { margin-top: 22px; }
    .invite {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      padding: 23px 26px;
      background: linear-gradient(120deg, #172943, var(--surface));
      border: 1px solid var(--line);
      border-radius: 16px;
    }
    .eyebrow {
      margin: 0 0 7px;
      color: #8fb5ff;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .invite h1 { margin: 0; font-size: clamp(1.35rem, 3vw, 1.8rem); letter-spacing: -.035em; }
    .invite p { margin: 7px 0 0; color: var(--muted); line-height: 1.55; }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 19px;
      border-radius: 10px;
      background: var(--blue);
      color: white;
      font-size: .93rem;
      font-weight: 750;
      text-decoration: none;
      white-space: nowrap;
      transition: background .18s ease, transform .18s ease;
    }
    .button:hover { background: #6495ef; transform: translateY(-1px); }
    .button.secondary { background: #27364d; border: 1px solid #405675; }
    .button.secondary:hover { background: #354965; }
    .invite-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    @media (max-width: 650px) { .invite-actions { flex-direction: column; } }
    .owners { margin-top: 42px; }
    .section-heading { margin-bottom: 17px; }
    .section-heading h2 { margin: 0; font-size: 1.45rem; letter-spacing: -.025em; }
    .section-heading p { margin: 6px 0 0; color: var(--muted); font-size: .94rem; }
    .owner-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .owner-card {
      position: relative;
      overflow: hidden;
      padding: 22px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
    }
    .owner-card::before {
      position: absolute;
      inset: 0 0 auto;
      height: 3px;
      background: linear-gradient(90deg, var(--blue), #7cafff);
      content: "";
    }
    .profile { display: flex; align-items: center; gap: 14px; }
    .avatar {
      display: grid;
      flex: 0 0 54px;
      width: 54px;
      height: 54px;
      place-items: center;
      border: 1px solid #5276ad;
      border-radius: 50%;
      background: var(--blue-soft);
      color: #e6efff;
      font-size: 1.25rem;
      font-weight: 800;
    }
    .identity { min-width: 0; }
    .role {
      display: inline-block;
      margin-bottom: 5px;
      color: #9fc0ff;
      font-size: .68rem;
      font-weight: 850;
      letter-spacing: .13em;
    }
    .identity h3 { margin: 0; overflow-wrap: anywhere; font-size: 1.13rem; }
    .handle { margin: 4px 0 0; color: var(--muted); font-size: .88rem; }
    .card-divider { height: 1px; margin: 18px 0 14px; background: var(--line); }
    .owner-detail { margin: 0; color: #d7e0ed; font-size: .9rem; line-height: 1.65; }
    .availability-label {
      margin: 0 0 5px;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 750;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .welcome {
      margin-top: 22px;
      padding: 24px 26px;
      background: #0f1a2a;
      border: 1px solid var(--line);
      border-radius: 16px;
    }
    .welcome h2 { margin: 0 0 8px; font-size: 1.18rem; }
    .welcome p { margin: 0; color: var(--muted); line-height: 1.7; }
    footer { padding: 24px 16px 0; color: #7f90a8; text-align: center; font-size: .82rem; }
    .credit { position: fixed; right: 16px; bottom: 12px; z-index: 10; padding: 7px 11px; border: 1px solid var(--line); border-radius: 999px; background: #111c2deF; color: #aab8cc; font-size: .72rem; box-shadow: 0 4px 18px #0004; }
    @media (max-width: 650px) {
      .page { width: min(100% - 24px, 540px); margin-top: 14px; }
      .banner { border-radius: 13px; }
      .invite { align-items: stretch; flex-direction: column; padding: 20px; }
      .button { width: 100%; }
      .owners { margin-top: 32px; }
      .owner-grid { grid-template-columns: 1fr; gap: 12px; }
      .owner-card { padding: 19px; }
    }
  </style>
</head>
<body>
  <main class="down-page">
    <div class="tape tape-top" aria-hidden="true"></div>
    <div class="tape tape-bottom" aria-hidden="true"></div>
    <div class="tape tape-left" aria-hidden="true"></div>
    <div class="tape tape-right" aria-hidden="true"></div>
    <section class="down-message">
      <p class="down-kicker">FUCK YOU</p>
      <h1>WEBSITE DOWN</h1>
      <p class="taken">TAKEN DOWN BY MORGAN AND HOLDEN</p>
      <p class="credit-line">(ass holes - by A Tesla Dumpster Man)</p>
    </section>
  </main>
  <style>
    body { margin:0; min-height:100vh; background:#080808; color:#fff; font-family:Arial,Helvetica,sans-serif; }
    .down-page { position:relative; display:grid; place-items:center; min-height:100vh; padding:100px 82px; overflow:hidden; }
    .down-message { width:min(100%,1050px); padding:clamp(28px,6vw,70px) 24px; text-align:center; background:#101010; border:3px solid #d71920; box-shadow:0 0 35px #d7192044; z-index:1; }
    .down-kicker { margin:0 0 22px; color:#ff2424; font-size:clamp(2.5rem,8vw,6.5rem); font-weight:1000; line-height:1; letter-spacing:.04em; }
    .down-message h1 { margin:0; color:#fff; font-size:clamp(2.8rem,9vw,7rem); font-weight:1000; line-height:1; letter-spacing:.02em; }
    .taken { margin:24px 0 10px; color:#ff3030; font-size:clamp(1.25rem,4vw,3rem); font-weight:950; line-height:1.15; }
    .credit-line { margin:0; color:#f2f2f2; font-size:clamp(1rem,2.8vw,1.8rem); font-weight:800; }
    .tape { position:absolute; z-index:2; background:repeating-linear-gradient(135deg,#ffd400 0 24px,#111 24px 48px); }
    .tape-top,.tape-bottom { left:0; right:0; height:64px; }
    .tape-top { top:0; border-bottom:5px solid #ffd400; }
    .tape-bottom { bottom:0; border-top:5px solid #ffd400; }
    .tape-left,.tape-right { top:0; bottom:0; width:64px; }
    .tape-left { left:0; border-right:5px solid #ffd400; }
    .tape-right { right:0; border-left:5px solid #ffd400; }
    @media(max-width:600px) {
      .down-page { padding:82px 52px; }
      .tape-top,.tape-bottom { height:48px; }
      .tape-left,.tape-right { width:42px; }
      .down-message { padding:30px 12px; }
    }
  </style>
</body>
</html>
